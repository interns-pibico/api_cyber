{% extends "base.html" %}

{% block title %}Login - API Cyber{% endblock %}

{% block body %}
<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <div class="logo-icon">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h1>API Cyber</h1>
            <p>Sistema de Monitoreo de Agentes</p>
        </div>

        <!-- Paso 1: usuario + contraseña -->
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> Usuario
                </label>
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Ingrese su usuario" required autofocus>
                </div>
            </div>
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Contraseña
                </label>
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required>
                </div>
            </div>
            <div id="errorMessage" class="error-message"></div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-sign-in-alt"></i>
                <span>Iniciar Sesión</span>
            </button>
        </form>

        <!-- Paso 2: código TOTP (oculto hasta que mfa_required=true) -->
        <div id="mfaStep" class="login-form mfa-step" style="display:none;">
            <div style="margin-bottom:1rem; text-align:center; color:var(--grey-dark);">
                <i class="fas fa-mobile-screen-button" style="font-size:2rem; color:var(--steel-blue); margin-bottom:.5rem; display:block;"></i>
                <strong>Verificación en dos pasos</strong>
                <p style="font-size:.83rem; margin-top:.25rem;">Abre tu app de autenticación e introduce el código de 6 dígitos.</p>
            </div>

            <div id="totpGroup" class="form-group">
                <label for="totpCode"><i class="fas fa-key"></i> Código de autenticación</label>
                <div class="input-group">
                    <i class="fas fa-key input-icon"></i>
                    <input type="text" id="totpCode" class="form-control mfa-code-input"
                           maxlength="6" inputmode="numeric" autocomplete="one-time-code"
                           placeholder="000000">
                </div>
            </div>

            <div id="backupGroup" class="form-group" style="display:none;">
                <label for="backupCode"><i class="fas fa-list-ol"></i> Código de recuperación</label>
                <div class="input-group">
                    <i class="fas fa-list-ol input-icon"></i>
                    <input type="text" id="backupCode" class="form-control"
                           placeholder="xxxxxxxx" autocomplete="off">
                </div>
            </div>

            <div id="mfaErrorMessage" class="error-message"></div>

            <button type="button" class="btn btn-primary" onclick="submitMfa()">
                <i class="fas fa-check-circle"></i>
                <span>Verificar</span>
            </button>

            <span class="mfa-or-link" id="toggleBackupLink" onclick="toggleBackupCode()">
                Usar código de recuperación
            </span>
            <span class="mfa-or-link" onclick="cancelMfa()" style="margin-top:.25rem; color:var(--grey-dark);">
                ← Volver al login
            </span>
        </div>
    </div>
</div>

<script>
let _mfaSession = null;
let _usingBackup = false;

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMessage');
    const submitBtn = e.target.querySelector('button[type="submit"]');

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Verificando...</span>';

    try {
        const response = await fetch('{{ root_path }}/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
        });

        const data = await response.json();

        if (response.ok) {
            if (data.mfa_required) {
                _mfaSession = data.mfa_session;
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('mfaStep').style.display = 'block';
                document.getElementById('totpCode').focus();
            } else {
                localStorage.setItem('token', data.access_token);
                window.location.href = '{{ root_path }}/dashboard';
            }
        } else {
            errorDiv.textContent = data.detail || 'Credenciales inválidas';
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Iniciar Sesión</span>';
        }
    } catch (err) {
        errorDiv.textContent = 'Error de conexión';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Iniciar Sesión</span>';
    }
});

// Auto-submit TOTP when 6 digits entered
document.getElementById('totpCode').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '');
    if (e.target.value.length === 6 && !_usingBackup) {
        submitMfa();
    }
});

async function submitMfa() {
    const errorDiv = document.getElementById('mfaErrorMessage');
    errorDiv.textContent = '';

    const body = { mfa_session: _mfaSession };
    if (_usingBackup) {
        body.backup_code = document.getElementById('backupCode').value.trim();
        if (!body.backup_code) { errorDiv.textContent = 'Introduce el código de recuperación'; return; }
    } else {
        body.totp_code = document.getElementById('totpCode').value.trim();
        if (body.totp_code.length !== 6) { errorDiv.textContent = 'El código debe tener 6 dígitos'; return; }
    }

    try {
        const response = await fetch('{{ root_path }}/api/v1/auth/mfa/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await response.json();
        if (response.ok && data.access_token) {
            localStorage.setItem('token', data.access_token);
            window.location.href = '{{ root_path }}/dashboard';
        } else {
            errorDiv.textContent = data.detail || 'Código inválido';
            document.getElementById('totpCode').value = '';
            document.getElementById('totpCode').focus();
        }
    } catch (err) {
        errorDiv.textContent = 'Error de conexión';
    }
}

function toggleBackupCode() {
    _usingBackup = !_usingBackup;
    document.getElementById('totpGroup').style.display = _usingBackup ? 'none' : 'block';
    document.getElementById('backupGroup').style.display = _usingBackup ? 'block' : 'none';
    document.getElementById('toggleBackupLink').textContent = _usingBackup
        ? 'Usar código de autenticación'
        : 'Usar código de recuperación';
    if (_usingBackup) document.getElementById('backupCode').focus();
    else document.getElementById('totpCode').focus();
}

function cancelMfa() {
    _mfaSession = null;
    _usingBackup = false;
    document.getElementById('mfaStep').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('totpCode').value = '';
    document.getElementById('backupCode').value = '';
    document.getElementById('mfaErrorMessage').textContent = '';
    document.getElementById('loginForm').querySelector('button[type="submit"]').disabled = false;
    document.getElementById('loginForm').querySelector('button[type="submit"]').innerHTML =
        '<i class="fas fa-sign-in-alt"></i> <span>Iniciar Sesión</span>';
}
</script>
{% endblock %}
