# Configuración Nginx para api_cyber
# URL: https://raquel.pibico.es/cyber
# Puerto: 6950
#
# INSTALACIÓN:
# 1. Copiar este archivo a /etc/nginx/conf.d/
#    sudo cp /home/erpnext/.services/api_cyber/nginx/api_cyber_nginx.conf /etc/nginx/conf.d/
#
# 2. Añadir el location block en el server block de raquel.pibico.es (443)
#    en /home/erpnext/erpnext-dev/config/nginx.conf
#
# 3. sudo nginx -t && sudo systemctl reload nginx

# Upstream para api_cyber
upstream api_cyber_backend {
    server 127.0.0.1:6950 fail_timeout=0;
}

